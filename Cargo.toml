[workspace]
resolver = "3"
members = [
  "waymaker-cli",
  "waymaker-lib",
  "waymaker-partial",
  "waymaker-partial-macros",
]

[patch.crates-io]
waymaker-lib = { path = "./waymaker-lib" }
waymaker-partial = { path = "./waymaker-partial" }
waymaker-partial-macros = { path = "./waymaker-partial-macros" }
nucleo = { git = "https://github.com/Squirreljetpack/nucleo", branch = "mm" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Granular size optimization for heavy graphic rasterizers, font parsers and markdown engines
# while preserving maximum opt-level = 3 for the core picker loop and SIMD matching engines.
[profile.release.package.resvg]
opt-level = "s"

[profile.release.package.usvg]
opt-level = "s"

[profile.release.package.tiny-skia]
opt-level = "s"

[profile.release.package.rustybuzz]
opt-level = "s"

[profile.release.package.fontdb]
opt-level = "s"

[profile.release.package.pulldown-cmark]
opt-level = "s"

[profile.release.package.mermaid-rs-renderer]
opt-level = "s"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "fat"

[workspace.dependencies]
cli_boilerplate_automation = { version = "0.4.0" }
waymaker-lib = { version = "0.0.*" }
waymaker-partial = { version = "0.0.*" }
waymaker-partial-macros = { version = "0.0.*", default-features = false }

[workspace.lints.clippy]
single_match = "allow"

