[tui]
percentage = 60
min = 10
max = 120

# --- UI ---
[ui]
border = { type = "Rounded" }
# sort_menu = { columns = 4, show_title = true }
# default_sort = "Natural"

# Folder-specific sort rules (evaluated top-to-bottom on startup and directory changes)
# [[folder_rules]]
# path = "~/Downloads"
# sort = "ModifiedReverse"
#
# [[folder_rules]]
# path = "*/screenshots"
# sort = "CreatedReverse"

[query]
prompt_style.fg = "Gray"

[results]
# wrap = true

[status]

[header]

[footer]
# --- Preview ---
[preview]
show = true
wrap = true
scroll_wrap = true
markdown = true

[preview.media]
active = true

[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --probe=off --format=symbols --size=80x35 "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''


side = "right"
percentage = 40
min = 30

[[preview.layout]]
side = "top"
percentage = 55
min = 5

[[preview.layout]]
side = "right"
percentage = 75
min = 5

[previewer]
always_trigger = true

# --- Misc ---
[matcher]

[columns]

[start.command]
command = ""
separator = "\\0"

[start]
ansi = false # don't set to true here

[exit]

[envs]
# CLIPcmd = # Leave blank to auto-determine
# PASTEcmd = # Leave blank to auto-determine
# PAGER = # Leave blank to auto-determine
# EDITOR = # Leave blank to auto-determine

# --- Binds ---
[binds]
# Essentia
"ctrl-c" = "Quit"
"esc" = "Quit(1)"
"enter" = "@accept"
"alt-enter" = "@Accept"
"ctrl-enter" = "@accept_2"
"ctrl-a" = "CycleAll"
"tab" = ["Toggle", "Down"]
"shift-backtab" = ["Toggle", "Up"]

# Edit
"right" = "ForwardChar"
"left" = "BackwardChar"
"ctrl-right" = "ForwardWord"
"ctrl-left" = "BackwardWord"
"backspace" = "DeleteChar"
"ctrl-h" = "DeleteWord"
"ctrl-u" = "Cancel"
"alt-a" = "QueryPos(0)"

# Navigation
"up" = "Up"
"ctrl-k" = "Up"
"down" = "Down"
"ctrl-j" = "Down"
"pagedown" = "HalfPageDown"
"pageup" = "HalfPageUp"
"shift-up" = "PreviewHalfPageUp"
"shift-down" = "PreviewHalfPageDown"
"ctrl-shift-up" = "VScroll(1)"
"ctrl-shift-down" = "VScroll(-1)"
"ctrl-shift-left" = "HScroll(-1)"
"ctrl-shift-right" = "HScroll(1)"
"alt-up" = "VScroll(1)"
"alt-down" = "VScroll(-1)"
"alt-left" = "HScroll(-1)"
"alt-right" = "HScroll(1)"
"alt-1" = "Pos(0)"
"alt-0" = "Pos(-1)"

# Columns
"ctrl-." = "NextColumn"
"ctrl-shift-." = "PrevColumn"

# Preview
"shift+scrollup" = "PreviewUp"
"shift+scrolldown" = "PreviewDown"
"alt-/" = "PreviewJump"
"ctrl-p" = "SwitchPreview"
"?" = "Help"
"shift-?" = "SwitchPreview"
"ctrl-/" = "CyclePreview" # cycle preview layouts
"ctrl-shift-/" = "CyclePreview"
"alt-h" = "Help"
"alt-=" = "ExpandPreview(2)"
"alt-shift-=" = "ExpandPreview(10)"
"alt-hyphen" = "ShrinkPreview(2)"

# Reserved
"F1" = "@help"
"F2" = "@rename"
"F3" = "@search"
"F4" = "@rm"
"F5" = "@reload"
"F6" = "@cycle"
"F7" = "@build"
"F8" = "@step"
"F9" = "@break"
"F10" = "@menu"
"F11" = "@look"
"F12" = "@save"

# Programmable
"ctrl-l" = "@look" # "maximize" the preview
"ctrl-o" = "@open"
"alt-o" = "@open_2"
"ctrl-r" = "@reload"
"ctrl-shift-r" = "@reload_2"
"ctrl-shift-n" = "@next"
"ctrl-shift-p" = "@prev"
"ctrl-tab" = "@next"
"ctrl-shift-tab" = "@prev"
"ctrl-shift-backtab" = "@prev"
"ctrl-d" = "@rm"
"Delete" = "@rm"
"ctrl-s" = "@show"

"@accept" = "Accept"
"@Accept" = "Accept"
"@accept_2" = "Accept"
"@look" = "Execute(eval $MM_PREVIEW_COMMAND | $PAGER)"
"@open" = "Execute($EDITOR {1})"
"@open_2" = "Become($EDITOR {1})"
"@reload" = "Reload"
"@next" = "ReloadNext"
"@prev" = "ReloadPrev"
"@cycle" = "ReloadNext"
"*" = "@bookmark"
"@help" = "Help"
"@break" = "Redraw" # invalid unicode or unsupported emoji can break rendering

# Printing
"alt-p" = "@print"
"alt-shift-p" = "@print_2"
"ctrl-y" = "@copy"
"ctrl-shift-y" = "@copy_all"
"alt-y" = "@copy_active"

"@print" = "Print({-})"
"@print_2" = "Print({-!})"
"@copy" = "CopyAsync(printf '%s\n' {+1})"
"@copy_all" = "CopyAsync(printf {})"
"@copy_active" = "CopyAsync(printf '%s\n' {+!})"
