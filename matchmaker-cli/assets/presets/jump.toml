# Matchmaker Jump Mode Preset (`mm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[ui]
nav_mode = true
nav_bar = "Plain"
nav_color = "Black"

[ui.parent_peek]
enabled = true

[ui.parent_peek.border]
show = false

[footer]
style.fg = "DarkGray"
style.modifier = "DIM"
match_indent = false

[query]
status_inline = true
filter_underline = true
filter_underline_style.fg = "DarkGray"

local_prompt = "> "
local_prompt_style.fg = "cyan"
local_underline_style.fg = "cyan"

frecency_prompt = "󱅤 "
frecency_prompt_style.fg = "blue"
frecency_underline_style.fg = "blue"

bookmarks_prompt = " "
bookmarks_prompt_style.fg = "yellow"
bookmarks_underline_style.fg = "yellow"

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
dir_first = true

[results]
max = 15
reverse = false
icons = true
bookmark_folder_icon = "󰮟"
bookmark_file_icon = "󱀻"
bookmark_icon_style.fg = "yellow"
frecency_folder_icon = "󰪻"
frecency_folder_icon_style.fg = "blue"
frecency_icon = "󱋢"
frecency_icon_style.fg = "blue"
symlink_target = true
symlink_target_style.fg = "cyan"

[previewer]
debounce_ms = 20
delay_clear = true

[preview]
media = true

[preview.border]
title_fg = "cyan"
color = "blue"
type = "Rounded"

[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --format=symbols --size=80x35 "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 50

[binds]
"ctrl-f" = "@dirs"
"ctrl-b" = "@bookmarks"
"*" = "@bookmark"
"ctrl-j" = "Down"
"ctrl-k" = "Up"
"ctrl-p" = "SwitchPreview"
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

[ui.nav_binds]
"j" = "Down"
"k" = "Up"
"f" = "@dirs"
"b" = "@bookmarks"
"*" = "@bookmark"
"l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-l" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-h" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-right" = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-left" = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"p" = "SwitchPreview"
"ctrl-p" = "SwitchPreview"
"u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]
"ctrl-u" = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

[breadcrumb]
show = true
separator = " / "
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Blue"

[start]
additional_commands = [
    "",
    "mm list --dirs 2>/dev/null",
    "mm list --bookmarks 2>/dev/null"
]

[start.command]
command = ""

# Automatic folder-specific sort rules
[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"
