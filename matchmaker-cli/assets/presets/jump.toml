# Matchmaker Jump Mode Preset (`mm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[ui]
nav_mode = true
nav_focus_on_start = "picker"
nav_bar = "Plain"
nav_color = "Black"
nav_notify = true

[ui.parent_peek]
enabled = true

[ui.parent_peek.border]
show = false

[footer]
style.fg = "DarkGray"
style.modifier = "DIM"
match_indent = false

[query]
status_inline = true
filter_underline = true
filter_underline_style.fg = "DarkGray"

local_prompt = "> "
local_prompt_style.fg = "cyan"
local_underline_style.fg = "cyan"

frecency_prompt = "󱅤 "
frecency_prompt_style.fg = "blue"
frecency_underline_style.fg = "blue"

bookmarks_prompt = " "
bookmarks_prompt_style.fg = "yellow"
bookmarks_underline_style.fg = "yellow"

[matcher]
sort = "smart"
sort_cap = 2000
depth_penalty = 15
frecency = true
frecency_weight = 2
typo_tolerance = true
dir_first = true

[results]
scroll_wrap = true
max = 15
reverse = false
icons = true
bookmark_folder_icon = "󰮟"
bookmark_file_icon = "󱀻"
bookmark_icon_style.fg = "yellow"
frecency_folder_icon = "󰪻"
frecency_folder_icon_style.fg = "blue"
frecency_icon = "󱋢"
frecency_icon_style.fg = "blue"
symlink_target = true
symlink_target_style.fg = "cyan"

[previewer]
debounce_ms = 35
delay_clear = true

[preview]
media = true
media_size = 1280

[preview.border]
title_fg = "cyan"
color = "blue"
type = "Rounded"

[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then mm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --probe=off --format=symbols --size=80x35 "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 50

[binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"ctrl-f"        = "@dirs"
"ctrl-b"        = "@bookmarks"
"*"             = "@bookmark"

# Foco e modos
"esc"           = "ToggleFocus"

# Navegação do cursor
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor, visualização e clipboard
"ctrl-e"        = "Execute(nvim {+})"
"ctrl-p"        = "SwitchPreview"
"ctrl-v"        = "@paste_into"

[ui.nav_binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"f"             = "@dirs"
"b"             = "@bookmarks"
"*"             = "@bookmark"

# Foco, seleção e saída
"/"             = "FocusFilter"
" "             = "Toggle"
"esc"           = "Quit"
"q"             = "Quit"

# Navegação do cursor
"j"             = "Down"
"k"             = "Up"
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"l"             = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"right"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"h"             = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"left"          = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor de texto
"e"             = "Execute(nvim {+})"
"ctrl-e"        = "Execute(nvim {+})"

# Operações de arquivo (FM / Clipboard)
"y"             = "@yank"
"x"             = "@cut"
"p"             = "@paste"
"P"             = "@paste_into"
"ctrl-v"        = "@paste_into"
"u"             = "@undo"
"ctrl-r"        = "@redo"

# Menus e painéis
"ctrl-p"        = "SwitchPreview"
","             = "SortMenu"
"\\"            = "ToggleParentPeek"

[breadcrumb]
show = true
separator = " / "
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Blue"

[start]
additional_commands = [
    "",
    "mm list --dirs 2>/dev/null",
    "mm list --bookmarks 2>/dev/null"
]

[start.command]
command = ""

# Automatic folder-specific sort rules
[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"
