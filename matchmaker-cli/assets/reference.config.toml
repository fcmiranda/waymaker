# ==============================================================================
# MATCHMAKER — ARQUIVO DE CONFIGURAÇÃO COMPLETO DE REFERÊNCIA
# ==============================================================================
# Este arquivo contém TODAS as propriedades disponíveis no Matchmaker,
# com seus tipos, valores possíveis e valores padrão (default) comentados.
# ==============================================================================

# ==============================================================================
# 1. TUI & TERMINAL ([tui])
# ==============================================================================
[tui]
# Altura do TUI em % da tela quando em modo inline (não-fullscreen).
# Valores: 1 a 100 | Default: (fullscreen se layout não for especificado)
# percentage = 60

# Limites mínimo e máximo de linhas para o modo inline.
# Valores: inteiros >= 1 | Default: min = 10, max = 120
# min = 10
# max = 120

# Restaura a tela original ao sair do Matchmaker.
# Valores: true, false | Default: true
restore_fullscreen = true

# Redesenha a interface automaticamente quando o terminal é redimensionado.
# Valores: true, false | Default: false
redraw_on_resize = false

# Habilita protocolo avançado de teclado Kitty Keyboard Protocol (shift-space, etc.).
# Valores: true, false | Default: true
extended_keys = true

# Delay em milissegundos antes de redimensionar ao entrar/sair da tela.
# Valores: inteiros (ms) | Default: 100
sleep_ms = 100

# Limpa a tela do TUI após fazer uma seleção.
# Valores: true, false | Default: true
clear_on_exit = true

# Limpa a tela após a execução de um comando externo (Execute).
# Valores: true, false | Default: true
clear_after_execute = true

# Usa o protocolo OSC 52 para copiar para a área de transferência do sistema.
# Se false, usa o comando CLIPcmd definido em [envs].
# Valores: true, false | Default: true
osc52 = true

# Habilita captura de eventos do mouse (clique, scroll, drag).
# Valores: true, false | Default: true
mouse = true

# Remove quebra de linha (\n) do final ao copiar texto.
# Valores: true, false | Default: false
copy_trailing_newline = false

# Canal de saída do TUI.
# Valores: "Stdout", "BufferedStderr" | Default: "Stdout"
stream = "Stdout"


# ==============================================================================
# 2. INTERFACE GLOBAL ([ui])
# ==============================================================================
[ui]
# Taxa de atualização do TUI em frames por segundo (FPS/ticks).
# Valores: inteiros (ex: 30, 60, 120) | Default: 60
tick_rate = 60

# Habilita o Modo Navegação (estilo gerenciador de arquivos/ranger/yazi).
# Permite alternar o foco entre o input de busca e a lista de resultados.
# Valores: true, false | Default: false
nav_mode = false

# Onde o foco do teclado inicia ao abrir o Matchmaker quando nav_mode = true.
# Valores: "Filter" (na barra de busca), "Picker" (na lista de resultados) | Default: "Filter"
nav_focus_on_start = "Filter"

# Cor do indicador quando o painel de resultados está em foco.
# Valores: "Yellow", "Cyan", "Green", "Red", "Blue", "Magenta", "White", "Black", "#RRGGBB" | Default: "Yellow"
nav_color = "Yellow"

# Faz o indicador de foco piscar.
# Valores: true, false | Default: false
nav_blink = false

# Velocidade do piscar quando nav_blink = true.
# Valores: "Slow", "Normal", "Rapid" | Default: "Normal"
nav_blink_rate = "Normal"

# Aplica estilo negrito ao indicador de foco.
# Valores: true, false | Default: false
nav_bold = false

# Estilo da barra lateral de foco na linha selecionada.
# Valores: "Plain", "Rounded", "Double", "Thick", "QuadrantOutside", "QuadrantInside", "None" | Default: "None"
# nav_bar = "Thick"

# Marcador em texto exibido na linha selecionada em modo navegação.
# Valores: texto livre (ex: ">> ", "▶ ") | Default: ""
nav_marker = ""

# Texto de prompt exibido enquanto a lista de resultados está em foco.
# Valores: texto livre (ex: "[NAV] > ") | Default: ""
nav_prompt = ""

# Exibe notificações flutuantes ao executar ações de clipboard (yank/cut).
# Valores: true, false | Default: false
nav_notify = false

# Quando true, teclas digitadas enquanto os resultados estão em foco vão para a busca.
# Valores: true, false | Default: false
nav_passthrough = false

# Ativa apenas binds básicos (j/k/J/K) no modo navegação sem atalhos de gerenciador de arquivos.
# Valores: true, false | Default: false
nav_basic = false

# Exibe dicas de atalhos no rodapé/status ao focar nos resultados.
# Valores: true, false | Default: true
nav_hints = true

# Borda externa do container global da UI.
[ui.border]
# Tipo de borda: "Plain", "Rounded", "Double", "Thick", "None" | Default: "None"
type = "None"
# Cor da borda: "Reset", "Blue", "Cyan", "DarkGray", "#RRGGBB", etc. | Default: "Reset"
color = "Reset"
# Cor de fundo: "Reset", "Black", etc. | Default: "Reset"
bg = "Reset"
# Lados visíveis: "ALL", "TOP | BOTTOM", "LEFT | RIGHT", "TOP", "" (nenhum) | Default: "ALL"
sides = "ALL"
# Espaçamento interno (padding): número único (todos os lados) ou [vertical, horizontal] ou [top, right, bottom, left]
padding = 0
# Título na borda | Default: ""
title = ""
# Modificador do título: "BOLD", "DIM", "ITALIC", "UNDERLINED", "None" | Default: "None"
title_modifier = "None"
# Cor do texto do título: "Reset" (herda cor da borda) ou cor específica | Default: "Reset"
title_fg = "Reset"

# Layout de 3 painéis (Parent Peek / Navegação estilo Miller Columns).
[ui.parent_peek]
# Habilita o painel esquerdo mostrando o diretório pai | Default: false
enabled = false
# Largura do painel pai em % da tela | Default: 15
pct = 15
# Altura máxima em linhas | Default: None
# max = 20
# Cor do título da pasta pai | Default: "Cyan"
parent_color = "Cyan"
# Destaca o diretório atual dentro da lista do pai | Default: true
highlight = true
# Cor do destaque da pasta atual | Default: "Yellow"
highlight_color = "Yellow"

[ui.parent_peek.border]
show = true
color = "DarkGray"
type = "Plain"

# Binds customizados para o modo navegação quando a lista está focada.
[ui.nav_binds]
"j" = "Down"
"k" = "Up"
"l" = ["ChDir({=})", "Reload", "Pos(0)"]
"h" = ["ChDir(..)", "Reload", "Pos(0)"]
"J" = "PreviewDown(1)"
"K" = "PreviewUp(1)"
"gg" = "Pos(0)"
"G" = "Pos(-1)"
"P" = "ToggleParentPeek"


# ==============================================================================
# 3. BARRA DE BUSCA / QUERY ([query])
# ==============================================================================
[query]
# Exibe a barra de busca.
# Valores: true, false | Default: true
show = true

# Prefixo da barra de busca.
# Prefixo da barra de busca padrão (ou quando a lista está em foco no modo navegação).
# Valores: string (ex: "> ", " ", "🔍 ") | Default: "> "
prompt = "> "

# Prefixo customizado da barra de busca quando estiver focado no modo filtro (digitando).
# Se omitido ou None, utiliza o valor de `prompt`.
# Valores: string (ex: " ", "FILTER > "), None | Default: None
# filter_prompt = " "

# Texto inicial preenchido na barra de busca.
# Valores: string | Default: ""
initial = ""

# Estilo do cursor na barra de busca.
# Valores: "default", "none" | Default: "default"
cursor = "default"

# Mantém espaçamento de rolagem ao navegar horizontalmente pelo texto digitado.
# Valores: true, false | Default: true
scroll_padding = true

# Exibe o contador de resultados (ex: 3/42) alinhado à direita dentro da barra de busca.
# Valores: true, false | Default: false
status_inline = false

# Estilo do texto padrão digitado pelo usuário.
[query.style]
# fg = "White"
# bg = "Reset"
# modifier = "None"

# Estilo do texto digitado especificamente quando focado no modo filtro.
[query.filter_style]
# fg = "White"
# modifier = "BOLD"

# Estilo do símbolo de prompt padrão ("> ").
[query.prompt_style]
fg = "Gray"
# modifier = "BOLD"

# Estilo do símbolo de prompt especificamente quando focado no modo filtro.
[query.filter_prompt_style]
# fg = "Yellow"
# modifier = "BOLD"

# Borda ao redor da barra de busca.
[query.border]
type = "None"
# color = "Cyan"


# ==============================================================================
# 4. TABELA DE RESULTADOS ([results])
# ==============================================================================
[results]
# Posição inicial do cursor na lista (índice 0-based ou negativo para contar do final, ex: -1 para o último item).
# Valores: inteiros (positivo ou negativo) | Default: None (inicia em 0)
# pos = 0

# Permite seleção múltipla de itens (com Tab / multi-select).
# Valores: true, false | Default: true
multi = true

# Marcador para itens selecionados via multi-select.
# Valores: string | Default: "▌ "
multi_prefix = "▌ "

# Marcador para itens não-selecionados.
# Valores: string | Default: "  "
unselected_prefix = "  "

# Prefixo padrão para todos os itens.
# Valores: string | Default: ""
default_prefix = ""

# Prefixo para a linha atualmente destacada/sob o cursor.
# Valores: string | Default: ""
current_prefix = ""

# Prefixo de caractere que ativa o spinner animado na linha (ex: "?", "@").
# Valores: string | Default: ""
spinner_prefix = ""

# Nome da animação do spinner.
# Valores: "dot", "line", "jump", "pulse", "points", "meter", "hamburger",
#          "ellipsis", "globe", "moon", "monkey", "arc", "nerd", "nerdarc", "minidot"
# Default: "dot"
spinner = "dot"

# Exibe o spinner inline no texto.
# Valores: true, false | Default: false
spinner_inline = false

# Volta ao início da lista ao rolar além do último item (e vice-versa).
# Valores: true, false | Default: false
scroll_wrap = false

# Número de linhas mantidas visíveis acima/abaixo do cursor ao rolar.
# Valores: inteiros >= 0 | Default: 2
scroll_padding = 2

# Inverte a ordem de exibição da lista (itens de baixo para cima).
# Valores: true, false, None | Default: None
# reverse = false

# Quebra linhas longas de resultados em múltiplas linhas.
# Valores: true, false | Default: false
wrap = false

# Largura mínima de cada coluna.
# Valores: inteiros >= 1 | Default: 2
min_width = 2

# Espaçamento em caracteres entre as colunas.
# Valores: inteiros >= 0 | Default: 1
column_spacing = 1

# Alinha a última coluna à direita da janela.
# Valores: true, false | Default: false
right_align_last = false

# Empilha colunas verticalmente em vez de lado a lado.
# Valores: true, false | Default: false
stacked_columns = false

# Separador horizontal entre as linhas.
# Valores: "None", "Empty", "Light", "Normal", "Heavy", "Dashed" | Default: "None"
separator = "None"

# Separador horizontal entre as 3 camadas ordenadas (diretórios diretos, arquivos diretos, itens profundos).
# Valores: "None", "Empty", "Light", "Normal", "Heavy", "Dashed", "Top", "Bottom", "Underline" | Default: "Top"
tier_separator = "Top"

# Como o estilo da linha selecionada se conecta pelas colunas:
# - "Disjoint": Estilos aplicados por coluna individual.
# - "Capped": Estilo inativo na linha toda, estilo ativo na coluna ativa.
# - "Full": Estilo de seleção cobre a linha inteira uniformemente.
# Valores: "Disjoint", "Capped", "Full" | Default: "Capped"
row_connection = "Capped"

# Exibe ícones de tipo de arquivo Nerd Font antes do nome do arquivo.
# Requer Nerd Font instalada no terminal.
# Valores: true, false | Default: false
icons = false

# Remove a cor individual do ícone na linha selecionada para harmonizar com a seleção.
# Valores: true, false | Default: false
uncolor_current_icon = false

# Inverte a cor do ícone na linha selecionada (ex: azul <-> amarelo).
# Valores: true, false | Default: false
invert_current_icon = false

# Exibe o destino de links simbólicos ("-> /caminho/destino").
# Valores: true, false | Default: false
symlink_target = false

# Estilo do texto padrão dos itens.
[results.style]
# fg = "White"

# Estilo dos caracteres que deram match com a busca.
[results.match_style]
fg = "Green"
modifier = "ITALIC"

# Estilo da linha atualmente selecionada/focada.
[results.current_style]
bg = "Black"
modifier = "BOLD"

# Estilo de colunas inativas.
[results.inactive_style]
# fg = "DarkGray"

# Estilo do marcador de prefixo ativo.
[results.prefix_style]
# fg = "Cyan"

# Estilo para itens marcados com multi-select.
[results.selected_style]
modifier = "BOLD"

# Estilo do prefixo de itens multi-selecionados.
[results.selected_prefix_style]
fg = "Cyan"
modifier = "BOLD"

# Estilo do prefixo de itens copiados (yank) no modo FM.
[results.yank_prefix_style]
fg = "Yellow"
modifier = "BOLD"

# Estilo do prefixo de itens recortados (cut) no modo FM.
[results.cut_prefix_style]
fg = "Red"
modifier = "BOLD"

# Estilo do texto de destino do link simbólico.
[results.symlink_target_style]
fg = "DarkGray"

# Estilo da linha separadora entre camadas (tier separator).
[results.tier_separator_style]
fg = "DarkGray"

# Configuração de rolagem horizontal automática (autoscroll).
[results.autoscroll]
# Habilita rolagem horizontal automática para manter o match visível | Default: true
enabled = true
# Número de caracteres no início da linha sempre preservados visíveis | Default: 0
initial_preserved = 0
# Caracteres de contexto exibidos ao redor do termo encontrado | Default: 4
context = 4
# Rola automaticamente até o final da linha | Default: false
end = false
# Indicador visual de texto cortado | Default: ".."
indicator = ".."
[results.autoscroll.indicator_style]
fg = "DarkGray"

[results.border]
type = "None"


# ==============================================================================
# 5. LINHA DE STATUS ([status])
# ==============================================================================
[status]
# Exibe a linha de status.
# Valores: true, false | Default: true
show = true

# Alinha a indentação do status com a tabela de resultados.
# Valores: true, false | Default: true
match_indent = true

# Template customizado da linha de status.
# Placeholders suportados:
#   \r -> índice do cursor atual
#   \m -> total de matches filtrados
#   \t -> total de itens carregados
#   \c -> coluna atual
#   \s -> espaço em branco disponível
#   \S -> incrementa o denominador de contagem
# Valores: string (ex: " \m/\t (\r)") | Default: "" (automático)
template = ""

# Estilo do texto de status.
[status.style]
fg = "Green"
modifier = "ITALIC"


# ==============================================================================
# 6. PAINEL DE PREVIEW ([preview])
# ==============================================================================
[preview]
# Exibe o painel de preview.
# Valores: true, false, ou número (largura mínima da tela para exibir) | Default: false
show = true

# Quebra de linha automática no preview de texto.
# Valores: true, false | Default: false
wrap = false

# Volta ao topo ao rolar além do final do preview (e vice-versa).
# Valores: true, false | Default: false
scroll_wrap = false

# Habilita visualização nativa de imagens, PDFs e vídeos via hardware/Kitty graphics.
# Valores: true, false | Default: false
media = true

# Força protocolo gráfico específico para imagens.
# Valores: "kitty", "sixel", "halfblocks", "iterm2", None (auto-detectar) | Default: None
# media_protocol = "kitty"

# Resolução em pixels para geração de thumbnails de mídia/vídeo/PDF.
# Valores: inteiros (px) (ex: 512, 800, 1200, 1600) | Default: 512
media_size = 1200

# Nível de zoom inicial para imagens e PDFs.
# Valores: ponto flutuante (ex: 1.0, 1.2, 1.5) | Default: 1.0
zoom = 1.0

# Modo de ajuste/enquadramento de imagem/PDF no painel:
# - "fit": Redimensiona mantendo a proporção inteira sem cortar nada.
# - "crop": Preenche a área toda ampliando a imagem/PDF e cortando excessos.
# - "scale": Estica para preencher a área exata.
# Valores: "fit", "crop", "scale" | Default: "crop"
media_fit = "fit"

# Largura da área de arrasto com o mouse para redimensionar o preview (0 = desativa).
# Valores: inteiros >= 0, None (usa largura da borda) | Default: None
# drag_width = 1

# Exibe a barra de rolagem (scrollbar) no painel de preview.
# Valores: true, false | Default: false
# scrollbar = true

# Borda do painel de preview.
[preview.border]
type = "Rounded"
color = "Cyan"
padding = 0

# Posição inicial da rolagem no preview.
[preview.initial]
# offset = -1
# percentage = 0
# header_lines = 0
# tail = false

# Lista de layouts e posições do preview (cicláveis com SwitchPreview / ctrl-p).
[[preview.layout]]
# Posição do preview na tela: "right", "left", "top", "bottom" | Default: "right"
side = "right"
# Porcentagem da tela ocupada pelo preview: 1 a 100 | Default: 50
percentage = 80
# Restrições de tamanho mínimo e máximo em colunas/linhas | Default: 0 (sem limite)
min = 20
max = 0

# Comando executado para gerar o preview de itens (quando não for imagem/mídia).
# Se vazio (""), usa o leitor nativo em Rust do Matchmaker.
# Placeholders: {1} item atual, {} linha completa, {+} todos selecionados.
command = ""


# ==============================================================================
# 7. EXECUTOR DE PREVIEW ([previewer])
# ==============================================================================
[previewer]
# Delay em milissegundos para disparar o preview ao mover o cursor (debounce).
# Valores: inteiros (ms) (ex: 0, 15, 25, 50) | Default: 0
debounce_ms = 25

# Evita tela preta limpando o preview anterior somente quando o novo carregar.
# Valores: true, false | Default: true
delay_clear = false

# Número máximo de processos de preview paralelos concorrentes.
# Valores: inteiros >= 1 | Default: 4
max_procs = 4

# Se false, não reexecuta o preview se o comando for idêntico ao anterior.
# Valores: true, false | Default: true
always_trigger = true

# Permite conversão UTF-8 com perda de caracteres em saídas binárias de preview.
# Valores: true, false | Default: false
try_lossy = false

# Remove espaços em branco do início/fim dos comandos de preview.
# Valores: true, false | Default: false
trim_commands = false

# Oculta ajuda semântica no painel de preview.
# Valores: true, false | Default: true
hide_semantic_help = true


# ==============================================================================
# 8. CABEÇALHO, RODAPÉ E BREADCRUMB
# ==============================================================================
# Cabeçalho estático no topo da lista ([header])
[header]
# content = "Pressione Ctrl-F para alternar fontes"
# header_lines = 0  # Número de linhas lidas da entrada stdin para o cabeçalho
match_indent = true
wrap = false

[header.style]
fg = "Cyan"

# Rodapé estático na base da lista ([footer])
[footer]
# content = "Matchmaker v0.0.42"
match_indent = true
wrap = false

[footer.style]
fg = "DarkGray"

# Breadcrumb exibindo o caminho da pasta atual no topo ([breadcrumb])
[breadcrumb]
# Habilita o breadcrumb | Default: false
show = true
# Caractere separador de pastas | Default: "  " (ou "/")
separator = "/"
# Trunca nomes longos de pastas intermediárias (0 = não trunca) | Default: 0
truncate_length = 0
# Exibe apenas a pasta atual em vez do caminho completo | Default: false
current_folder_only = false

[breadcrumb.style]
fg = "Cyan"
modifier = "BOLD"

[breadcrumb.separator_style]
fg = "DarkGray"


# ==============================================================================
# 9. MOTOR DE BUSCA, ORDENAÇÃO E FRECÊNCIA ([matcher])
# ==============================================================================
[matcher]
# Normalização de caracteres com acentos (ex: 'e' dá match em 'é').
# Valores: true, false | Default: true
normalize = true

# Busca insensível a maiúsculas/minúsculas.
# Valores: true, false | Default: true
ignore_case = true

# Prioriza matches que começam com o prefixo digitado.
# Valores: true, false | Default: false
prefer_prefix = false

# Otimização especializada para caminhos de arquivo.
# Valores: true, false | Default: false
match_paths = false

# Ordenação dos resultados:
# - "smart" / "auto": Mantém ordem natural quando a busca está vazia e ordena por relevância ao digitar.
# - true / 0: Sempre ordena por pontuação.
# - false: Nunca ordena (mantém ordem de inserção da stream).
# Valores: "smart", "auto", true, false, inteiros >= 0 | Default: "smart"
sort_threshold = "smart"

# Habilita pontuação baseada em Frecência (frequência + recência de acesso).
# Valores: true, false | Default: false
frecency = true

# Multiplicador de pontos extras para frecência.
# Valores: inteiros >= 1 | Default: 1
frecency_weight = 1

# Meia-vida em dias para decaimento exponencial contínuo da frecência (0 = legado).
# Valores: inteiros (dias) | Default: 7
frecency_half_life_days = 7

# Bônus percentual de pontuação para itens dentro do diretório atual (CWD).
# Valores: inteiros (%) (ex: 30 = +30%, 0 = desativado) | Default: 30
location_bias = 30

# Penalidade de pontos por nível de profundidade de pasta ('/' ou '\').
# Ajuda a priorizar arquivos na raiz da pasta em vez de subpastas profundas.
# Valores: inteiros >= 0 (ex: 15) | Default: 0
depth_penalty = 0

# Tolerância a erros de digitação (typos) para buscas com >= 3 caracteres.
# Valores: true, false | Default: false
typo_tolerance = false

# Prioriza subpastas diretas no topo da lista antes de arquivos normais.
# Valores: true, false | Default: false
dir_first = false

# Limite máximo de itens recalculados para ordenação de frecência/depth (0 = sem limite).
# Valores: inteiros >= 0 | Default: 1000
sort_cap = 1000


# ==============================================================================
# 10. ENTRADA E COMANDOS DE INICIALIZAÇÃO ([start])
# ==============================================================================
[start]
# Comando executado para gerar itens quando o stdin não estiver conectado.
# Pode ser definido como string ou bloco [start.command].
[start.command]
command = ""
separator = "\n"

# Lista de comandos alternativos cicláveis via ReloadNext (ex: ctrl-f).
additional_commands = [
    "",
    "mm list --dirs 2>/dev/null"
]

# Separador de itens de entrada.
# Valores: "\n", "\0", "\\0", etc. | Default: "\n"
input_separator = "\n"

# Separador de itens na saída final.
# Valores: "\n", " ", etc. | Default: "\n"
output_separator = "\n"

# Template de formatação para os itens impressos ao aceitar (Enter).
# Valores: "{}" (linha toda), "{1}" (coluna 1), etc. | Default: None
# output_template = "{1}"

# Aguarda o comando terminar antes de abrir o TUI.
# Valores: true, false | Default: false
sync = false

# Processa e renderiza códigos de cores ANSI da entrada.
# Valores: true, false | Default: false
ansi = false

# Remove espaços em branco do início e fim das linhas de entrada.
# Valores: true, false | Default: false
trim = false

# Ordena linhas alfabeticamente ao ler do stdin.
# Valores: true, false | Default: false
sort = false

# Intervalo em milissegundos para recarregar periodicamente a lista.
# Valores: inteiros (ms), None | Default: None
# reload_interval = 5000


# ==============================================================================
# 11. COLUNAS ([columns])
# ==============================================================================
[columns]
# Estratégia para dividir linhas de entrada em colunas.
# Exemplos:
#   split = "\\s+"               (divide por espaços)
#   split = "(\\d+)\\s+(.*)"     (grupos de captura regex)
#   split = ["re1", "re2"]       (múltiplas regexes)
# Valores: "None", regex string, array de regexes | Default: "None"
# split = "\\s+"

# Número máximo de colunas geradas automaticamente (1 a 16).
# Valores: 1 a 16 | Default: 6
max_columns = 6

# Começa a numeração de colunas automáticas em 0 em vez de 1.
# Valores: true, false | Default: false
names_from_zero = false

# Nome da coluna padrão usada para busca e preview.
# default = "nome_da_coluna"


# ==============================================================================
# 12. CONDIÇÕES DE SAÍDA ([exit])
# ==============================================================================
[exit]
# Sai automaticamente selecionando o item se houver apenas 1 resultado correspondente.
# Valores: true, false | Default: false
select_1 = false

# Permite sair pressionando Enter sem nenhum item selecionado (retorna vazio).
# Valores: true, false | Default: false
allow_empty = false

# Aborta e fecha se a entrada não tiver nenhum item.
# Valores: true, false | Default: true
abort_empty = true

# Caminho de arquivo onde a última tecla pressionada será gravada ao sair.
# last_key_path = "/tmp/mm_last_key"


# ==============================================================================
# 13. VARIÁVEIS DE AMBIENTE ([envs])
# ==============================================================================
[envs]
# Utilitário de clipboard para cópia quando osc52 = false (ex: "xclip -selection clipboard", "wl-copy")
# CLIPcmd = ""
# Utilitário de colagem (ex: "xclip -o", "wl-paste")
# PASTEcmd = ""
# Paginador de texto (ex: "less", "bat")
# PAGER = ""
# Editor de texto (ex: "nvim", "hx", "vim", "nano")
# EDITOR = ""


# ==============================================================================
# 14. REGRAS CONDICIONAIS POR PASTA ([[rule]] / [[rules]])
# ==============================================================================
# Permite aplicar configurações ou presets automaticamente dependendo da pasta atual.
[[rule]]
paths = ["~/Downloads", "~/downloads"]
preset = "downloads"

# [[rule]]
# path = "~/projects/*"
# [rule.preview]
# show = true


# ==============================================================================
# 15. ATALHOS DE TECLADO ([binds])
# ==============================================================================
# Sintaxe: "tecla" = "Ação" ou "tecla" = ["Ação1", "Ação2", ...]
# Suporta macros com @nome e execução de comandos via Execute(...) ou Become(...)
[binds]
# Essenciais e Saída
"ctrl-c" = "Quit"
"esc" = "Quit"
"enter" = "Accept"
"ctrl-enter" = "Accept"
"ctrl-a" = "CycleAll"
"tab" = ["Toggle", "Down"]
"shift-backtab" = ["Toggle", "Up"]

# Edição da Busca
"right" = "ForwardChar"
"left" = "BackwardChar"
"ctrl-right" = "ForwardWord"
"ctrl-left" = "BackwardWord"
"backspace" = "DeleteChar"
"ctrl-h" = "DeleteWord"
"ctrl-u" = "Cancel"
"alt-a" = "QueryPos(0)"

# Navegação
"up" = "Up"
"ctrl-k" = "Up"
"down" = "Down"
"ctrl-j" = "Down"
"pagedown" = "HalfPageDown"
"pageup" = "HalfPageUp"
"alt-1" = "Pos(0)"
"alt-0" = "Pos(-1)"

# Controle do Preview
"shift-up" = "PreviewHalfPageUp"
"shift-down" = "PreviewHalfPageDown"
"ctrl-shift-up" = "VScroll(1)"
"ctrl-shift-down" = "VScroll(-1)"
"ctrl-p" = "SwitchPreview"
"ctrl-/" = "CyclePreview"
"alt-=" = "ExpandPreview(2)"
"alt-hyphen" = "ShrinkPreview(2)"

# Fontes e Recarregamento
"ctrl-f" = "ReloadNext"
"ctrl-r" = "Reload"

# Ajuda
"?" = "Help"
"F1" = "Help"
