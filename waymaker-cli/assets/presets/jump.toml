# Waymaker Jump Mode Preset (`wm -o jump`)
# Interactive directory navigation, frecency ranking, and TUI traversal.

[ui.nav]
active = true
profile = "fm"
focus_on_start = "picker"
bar = "Plain"
color = "Black"
notify = true
hints = true
hints_columns = 4

[ui.parent_peek]
enabled = true

[ui.parent_peek.border]
show = false

[footer]
style.fg = "DarkGray"
style.modifier = "DIM"
match_indent = false

[query]
status_inline = true

[query.filter]
underline = true
underline_style.fg = "DarkGray"

[query.local]
prompt = "> "
prompt_style.fg = "cyan"
underline_style.fg = "cyan"

[query.frecency]
prompt = "󱅤 "
prompt_style.fg = "blue"
underline_style.fg = "blue"

[query.bookmarks]
prompt = " "
prompt_style.fg = "yellow"
underline_style.fg = "yellow"

[matcher]
depth_penalty = 15
typo_tolerance = true
dir_first = true

[matcher.sort]
threshold = "smart"
cap = 2000

[matcher.frecency]
active = true
weight = 2

[results]
scroll_wrap = true
max = 15
reverse = false
icons = true

[results.bookmark]
folder_icon = "󰮟"
file_icon = "󱀻"
icon_style.fg = "yellow"

[results.frecency]
folder_icon = "󰪻"
folder_icon_style.fg = "blue"
icon = "󱋢"
icon_style.fg = "blue"

[results.symlink]
active = true
style.fg = "cyan"

[previewer]
debounce_ms = 35
delay_clear = true

[preview]
markdown = true

[preview.media]
active = true
size = 1280

[preview.border]
title_fg = "cyan"
color = "blue"
type = "Rounded"

[[preview.layout]]
command = '''p={1}; p="${p/#\~/$HOME}"; if [ -d "$p" ]; then wm tree "$p" 2>/dev/null || eza --tree --level=2 --icons=always --git-ignore --color=always "$p" 2>/dev/null || ls -la "$p"; elif [[ "$p" =~ \.(md|markdown|mdown|mkd)$ ]]; then wm md "$p" 2>/dev/null || bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; elif [[ "$p" =~ \.(mmd|mermaid)$ ]]; then wm mermaid "$p" 2>/dev/null || bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; else mime=$(file -b --mime-type "$p" 2>/dev/null); if [[ "$mime" == image/* ]]; then if command -v chafa >/dev/null 2>&1; then chafa --probe=off --format=symbols --size=80x35 "$p" 2>/dev/null; elif command -v img2txt >/dev/null 2>&1; then img2txt -f ansi -W 60 "$p" 2>/dev/null; fi; echo ""; identify "$p" 2>/dev/null || file "$p"; else bat --style=numbers --color=always --line-range=:300 "$p" 2>/dev/null || cat "$p"; fi; fi'''
side = "right"
percentage = 50


[binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"ctrl-f"        = "@dirs"
"ctrl-b"        = "@bookmarks"
"*"             = "@bookmark"

# Foco e modos
"esc"           = "ToggleFocus"

# Navegação do cursor
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor, visualização e clipboard
"ctrl-e"        = "Execute(nvim {+})"
"ctrl-p"        = "SwitchPreview"
"ctrl-v"        = "@paste_into"

[ui.nav.binds]
# Modos de dados (ciclar fontes e favoritos)
"tab"           = "@reloadnext"
"shift-backtab" = "@reloadprev"
"backtab"       = "@reloadprev"
"f"             = "@dirs"
"b"             = "@bookmarks"
"*"             = "@bookmark"

# Foco, seleção e saída
"/"             = "FocusFilter"
" "             = "Toggle"
"esc"           = "Quit"
"q"             = "Quit"

# Navegação do cursor
"j"             = "Down"
"k"             = "Up"
"ctrl-j"        = "Down"
"ctrl-k"        = "Up"
"alt-j"         = "Down"
"alt-k"         = "Up"

# Navegação de diretórios (entrar / descer)
"l"             = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"right"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-l"        = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"ctrl-right"    = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]
"alt-l"         = ["ChDir({=})", "Cancel", "Reload", "Pos(0)", "FocusNav"]

# Navegação de diretórios (subir / parent)
"h"             = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"left"          = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"backspace"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-h"        = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"ctrl-left"     = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]
"alt-h"         = ["ChDir(..)", "Cancel", "Reload", "FocusNav"]

# Histórico de ancestrais (subir múltiplos níveis)
"ctrl-u"        = ["Reload(curr=\"$(pwd)\"; while [ \"$curr\" != \"/\" ] && [ -n \"$curr\" ]; do curr=\"$(dirname \"$curr\")\"; echo \"$curr\"; done)", "Cancel", "Pos(0)"]

# Editor de texto
"e"             = "Execute(nvim {+})"
"ctrl-e"        = "Execute(nvim {+})"

# Operações de arquivo (FM / Clipboard)
"y"             = "@yank"
"x"             = "@cut"
"p"             = "@paste"
"P"             = "@paste_into"
"ctrl-v"        = "@paste_into"
"u"             = "@undo"
"ctrl-r"        = "@redo"

# Menus e painéis
"ctrl-p"        = "SwitchPreview"
","             = "SortMenu"
"\\"            = "ToggleParentPeek"

[breadcrumb]
show = true
separator = " / "
style.fg = "Cyan"
style.modifier = "BOLD"
separator_style.fg = "Blue"

[start]

[start.command]
command = ""
additional = [
    "",
    "wm list --dirs 2>/dev/null",
    "wm list --bookmarks 2>/dev/null"
]

# Automatic folder-specific sort rules
[[folder_rules]]
path = "~/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/Downloads"
sort = "ModifiedReverse"

[[folder_rules]]
path = "*/screenshots"
sort = "CreatedReverse"

[[folder_rules]]
path = "*/Screenshots"
sort = "CreatedReverse"
